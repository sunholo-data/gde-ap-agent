<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="GDE AP Agent">
  <!-- Gold radial gradient background -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  <!-- AP monogram in deep navy, properly centered -->
  <text x="16" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#1A1F2E" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.5">AP</text>
</svg>
