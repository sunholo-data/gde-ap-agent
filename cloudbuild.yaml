# GDE AP Agent -- Cloud Build configuration
# Multi-container Cloud Run: frontend (main) + backend (sidecar)
# Deployed via Multivac terraform (infrastructure/environments/common/terraform.tfvars).
# Branch convention: dev branch -> multivac-internal-dev
#
# Substitutions are injected by Terraform triggers in multivac-deploy.

substitutions:
  _SERVICE_NAME: gde-ap-agent
  _REGION: terraform_managed
  _BUILD_FOLDER: .
  # Multivac terraform provides _ARTIFACT_REGISTRY_REPO_URL (not the _CLIENT suffix).
  _ARTIFACT_REGISTRY_REPO_URL: terraform_managed
  _PROJECT_ID: terraform_managed
  _FIREBASE_BUCKET: '${_PROJECT_ID}.firebasestorage.app'
  # Firebase helper image lives in multivac-deploy/llm-ops/sunholo-llmops/firebase.
  _FIREBASE_TAG: dev
  # Admin seed allowlist — SA emails permitted to call /api/admin/seed-platform-skills.
  _ADMIN_SEED_ALLOWED_SAS: terraform_managed
  # Channel feature flags — leave 'false' until Secret Manager secrets exist.
  _ENABLE_ANTHROPIC: 'true'
  _ENABLE_TELEGRAM: 'false'
  _ENABLE_WHATSAPP: 'false'
  _ENABLE_EMAIL: 'false'
  # Set to 'true' when AGENT_ENGINE_ID secret exists in Secret Manager.
  # Leave 'false' to fall back to in-memory ADK sessions (fine for demo).
  _ENABLE_AGENT_ENGINE: 'false'
  # Platform skill owner email. Terraform sets this per environment.
  _PLATFORM_OWNER_EMAIL: ''
  # MCP sandbox iframe URL. Leave blank to disable MCP Apps.
  _MCP_SANDBOX_URL: 'https://mcp-sandbox-374404277595.europe-west1.run.app'
  # MCP sandbox conditional auto-deploy:
  #  - ALLOWED_HOST_ORIGINS the sandbox accepts as iframe parents
  #    (comma-separated; validated against document.referrer in sandbox.ts)
  #  - SERVICE name (matches the existing service in this project)
  # Terraform can override _MCP_SANDBOX_ALLOWED_ORIGINS per env when test/prod cut.
  _MCP_SANDBOX_SERVICE: 'mcp-sandbox'
  _MCP_SANDBOX_ALLOWED_ORIGINS: 'https://aitana-v6-frontend-66pa3y5xnq-ew.a.run.app,https://gde-ap-agent-blqtqfexwa-ew.a.run.app'
  # GCS demo bucket pre-loaded with AP invoice examples for the sidebar browser.
  _AP_DEMO_BUCKET: 'gde-ap-agent-demo-invoices'

tags: ['${_PROJECT_ID}', '${_SERVICE_NAME}']

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # --- Conditional: redeploy mcp-sandbox if its sources changed ---
  # Fixes Friction 14 (template-protocols-friction.md) — the sandbox is a
  # separate Cloud Run service whose container holds the artefact HTML.
  # Without this step, an artefact-only commit deploys the main service
  # but leaves the iframe content stale until someone runs
  # `make deploy-mcp-sandbox` manually.
  #
  # Detection: diff the most recent commit for any path under
  # infrastructure/mcp-sandbox/. The trigger fires on every dev push so
  # HEAD~1 should always exist; if it doesn't (shallow clone edge case
  # or first commit) we deploy defensively rather than silently skipping.
  #
  # Runs in parallel with the main backend/frontend build (waitFor: ['-'])
  # so it doesn't add latency to the critical path.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: maybe-deploy-mcp-sandbox
    waitFor: ['-']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        CHANGED=""
        if git rev-parse --quiet --verify HEAD~1 >/dev/null 2>&1; then
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- infrastructure/mcp-sandbox/ || true)
        else
          CHANGED="bootstrap"
        fi
        if [ -z "$$CHANGED" ]; then
          echo "No infrastructure/mcp-sandbox/** changes in this commit — skipping sandbox deploy."
          exit 0
        fi
        echo "mcp-sandbox changes detected:"
        printf '  %s\n' $$CHANGED
        echo ""
        cd infrastructure/mcp-sandbox
        # ^@^ delimiter override so commas inside ALLOWED_HOST_ORIGINS
        # survive --set-env-vars parsing. See `gcloud topic escaping`.
        gcloud run deploy ${_MCP_SANDBOX_SERVICE} \
          --source=. \
          --project=${_PROJECT_ID} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --max-instances=3 \
          --memory=512Mi \
          --cpu=1 \
          "--set-env-vars=^@^ALLOWED_HOST_ORIGINS=${_MCP_SANDBOX_ALLOWED_ORIGINS}" \
          --quiet
        URL=$(gcloud run services describe ${_MCP_SANDBOX_SERVICE} \
          --project=${_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)' 2>/dev/null || true)
        echo "mcp-sandbox deployed: $${URL}"

  # --- Firebase rules ---
  - name: '${_ARTIFACT_REGISTRY_REPO_URL}/sunholo-llmops/firebase:${_FIREBASE_TAG}'
    waitFor: ['-']
    id: 'deploy-firebase-rules'
    entrypoint: bash
    args:
      - '-c'
      - |
        firebase &&
        firebase -P ${_PROJECT_ID} --json deploy --only firestore:rules,firestore:indexes --force

  # --- Get Firebase config from Secret Manager ---
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-firebase-config'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - './get-firebase-config.sh'
    env:
      - '_PROJECT_ID=$_PROJECT_ID'

  # --- Build frontend ---
  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    waitFor: ['get-firebase-config']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ARGS=$$(cat /workspace/docker_args)
        docker build $$ARGS \
          --build-arg NEXT_PUBLIC_MCP_SANDBOX_URL=${_MCP_SANDBOX_URL} \
          -t ${_ARTIFACT_REGISTRY_REPO_URL}/${_SERVICE_NAME}/ui:${BRANCH_NAME} \
          -f frontend/Dockerfile \
          frontend/

  # --- Build backend ---
  - name: 'gcr.io/cloud-builders/docker'
    id: build-backend
    waitFor: ['-']
    dir: ${_BUILD_FOLDER}/backend
    args:
      - 'build'
      - '--build-arg'
      - 'FIREBASE_BUCKET=${_FIREBASE_BUCKET}'
      - '--build-arg'
      - 'GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}'
      - '--build-arg'
      - 'GOOGLE_CLOUD_LOCATION=${_REGION}'
      - '-t'
      - '${_ARTIFACT_REGISTRY_REPO_URL}/${_SERVICE_NAME}/backend:${BRANCH_NAME}'
      - '.'

  # --- Push images ---
  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    waitFor: ['build-frontend']
    args: ['push', '${_ARTIFACT_REGISTRY_REPO_URL}/${_SERVICE_NAME}/ui:${BRANCH_NAME}']

  - name: 'gcr.io/cloud-builders/docker'
    id: push-backend
    waitFor: ['build-backend']
    args: ['push', '${_ARTIFACT_REGISTRY_REPO_URL}/${_SERVICE_NAME}/backend:${BRANCH_NAME}']

  # --- Deploy to Cloud Run (multi-container) ---
  # Uses bash so channel secrets can be conditionally included based on
  # _ENABLE_* substitution flags (see docs/ops/gotchas.md #5).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    waitFor: ['push-frontend', 'push-backend']
    args:
      - '-c'
      - |
        set -euo pipefail
        SECRETS=""
        # ADK agent engine — only wired when secret exists and flag is true
        if [ "${_ENABLE_AGENT_ENGINE}" = "true" ]; then
          SECRETS="AGENT_ENGINE_ID=AGENT_ENGINE_ID:latest"
        fi
        # AI model key — almost always needed; set _ENABLE_ANTHROPIC=false to skip
        if [ "${_ENABLE_ANTHROPIC}" = "true" ]; then
          SEP=$${SECRETS:+,}
          SECRETS="$${SECRETS}$${SEP}ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest"
        fi
        # AILANG Parse key — deterministic Office/structured-text extraction.
        # Without it, every upload falls through to "preview_only" (PDF iframe
        # for PDFs, "preview unavailable" for everything else).
        SEP=$${SECRETS:+,}
        SECRETS="$${SECRETS}$${SEP}DOCPARSE_API_KEY=DOCPARSE_API_KEY:latest"
        # Channel secrets — only wired when the channel is enabled
        if [ "${_ENABLE_TELEGRAM}" = "true" ]; then
          SECRETS="$${SECRETS},TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest"
        fi
        if [ "${_ENABLE_WHATSAPP}" = "true" ]; then
          SECRETS="$${SECRETS},TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest"
        fi
        if [ "${_ENABLE_EMAIL}" = "true" ]; then
          SECRETS="$${SECRETS},MAILGUN_API_KEY=MAILGUN_API_KEY:latest,MAILGUN_WEBHOOK_SECRET=MAILGUN_WEBHOOK_SECRET:latest"
        fi
        gcloud run deploy ${_SERVICE_NAME} \
          --region=${_REGION} \
          --project=${_PROJECT_ID} \
          --platform=managed \
          --allow-unauthenticated \
          --min-instances=1 \
          --max-instances=3 \
          --session-affinity \
          --service-account=sa-${_SERVICE_NAME}@${_PROJECT_ID}.iam.gserviceaccount.com \
          --container=main \
          --image=${_ARTIFACT_REGISTRY_REPO_URL}/${_SERVICE_NAME}/ui:${BRANCH_NAME} \
          --port=8080 \
          --memory=2Gi \
          --cpu=1 \
          --set-env-vars=BACKEND_URL=http://127.0.0.1:1956 \
          --container=sidecar \
          --image=${_ARTIFACT_REGISTRY_REPO_URL}/${_SERVICE_NAME}/backend:${BRANCH_NAME} \
          --memory=4Gi \
          --cpu=2 \
          --startup-probe=tcpSocket.port=1956,periodSeconds=5,failureThreshold=24,timeoutSeconds=5 \
          $${SECRETS:+--set-secrets="$${SECRETS}"} \
          --set-env-vars=TWILIO_WHATSAPP_NUMBER=whatsapp:+14155238886 \
          --set-env-vars=GOOGLE_CLOUD_PROJECT=${_PROJECT_ID} \
          --set-env-vars=GOOGLE_CLOUD_LOCATION=global \
          --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=True \
          --set-env-vars=ADK_ARTIFACT_BUCKET=${_PROJECT_ID}-artifacts \
          --set-env-vars=DOCUMENTS_BUCKET=${_PROJECT_ID}.firebasestorage.app \
          --set-env-vars=LOGS_BUCKET_NAME=${_PROJECT_ID}-aitana-v6-logs \
          --set-env-vars=GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY=true \
          --set-env-vars=OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true \
          "--set-env-vars=^|^ADMIN_SEED_ALLOWED_SAS=${_ADMIN_SEED_ALLOWED_SAS}" \
          --set-env-vars=PLATFORM_OWNER_EMAIL=${_PLATFORM_OWNER_EMAIL} \
          --set-env-vars=AP_DEMO_BUCKET=${_AP_DEMO_BUCKET} \
          --set-env-vars=DATASTORE_LOCATION=eu \
          --set-env-vars=EXTRACTION_MODEL=gemini-3.5-flash \
          --set-env-vars=ENABLE_A2A_INVOCATION=true \
          --set-env-vars=A2A_INVOCATION_REQUIRE_AUTH=false \
          --set-env-vars=PUBLIC_BASE_URL=https://gde-ap-agent-blqtqfexwa-ew.a.run.app

  # --- Post-deploy smoke: fail the build if any critical endpoint is not 200 ---
  # Per CLAUDE.md: no feature lands with manual-only verification. This step
  # protects against sidecar-silently-not-running bugs like FE-BRINGUP-1
  # (see docs/ops/deployed-urls.md for background).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: smoke-deployed
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --project=${_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)')
        echo "Smoking $${URL}"
        # Wait for the new revision to finish cold-start initialisation.
        # Cloud Run marks a revision Ready once the startup probe passes
        # (TCP port open), but the Python/FastAPI process may still be
        # loading model clients. 30 s is enough to avoid false 000 timeouts.
        echo "Waiting 30s for cold-start initialisation..."
        sleep 30
        fail=0
        # Public endpoints — expect 200
        for path in "/" "/api/health" "/api/proxy/health" "/api/proxy/api/skills/marketplace"; do
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 45 "$${URL}$${path}") || code=000
          body=$(head -c 200 /tmp/body)
          if [ "$${code}" = "200" ]; then
            echo "OK   $${path} -> 200"
          else
            echo "FAIL $${path} -> $${code} body=$${body}"
            fail=1
          fi
        done
        # Auth-protected — expect 401 without token (not Next 404 — FE-BRINGUP-1 guard)
        for path in "/api/proxy/api/skills" "/api/proxy/api/auth/whoami"; do
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 45 "$${URL}$${path}") || code=000
          body=$(head -c 200 /tmp/body)
          if [ "$${code}" = "401" ]; then
            echo "OK   $${path} -> 401 (auth required)"
          else
            echo "FAIL $${path} -> $${code} (expected 401) body=$${body}"
            fail=1
          fi
        done
        exit $${fail}

  # --- Platform-skill seed (via sidecar proxy). Idempotent. Fails build on error.
  # Uses the GCE metadata-server identity endpoint — this works under any SA
  # (user-managed or default), unlike `gcloud auth print-identity-token`.
  # include_email=true is required: the backend allowlist check needs the email
  # claim (see docs/ops/gotchas.md #13 #14 and docs/ops/platform-skills.md).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: seed-platform-skills
    waitFor: ['smoke-deployed']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --project=${_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)')
        TOKEN=$(curl -sf \
          "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=$${URL}&format=full&include_email=true" \
          -H "Metadata-Flavor: Google")
        code=$(curl -sS -o /tmp/seed -w '%{http_code}' --max-time 60 \
          -X POST -H "Authorization: Bearer $${TOKEN}" \
          "$${URL}/api/proxy/api/admin/seed-platform-skills") || code=000
        body=$(head -c 300 /tmp/seed)
        echo "seed-platform-skills -> $${code} body=$${body}"
        if [ "$${code}" != "200" ]; then
          echo "ERROR: seed step returned $${code} — marketplace will be empty" >&2
          exit 1
        fi
