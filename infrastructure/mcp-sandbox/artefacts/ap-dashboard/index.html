<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AP Analytics</title>
  <style>
    :root, :root[data-theme="light"] {
      --bg: #ffffff;
      --bg-elev: #f7f9fc;
      --bg-card: #ffffff;
      --fg: hsl(216, 65%, 14%);
      --fg-muted: hsl(215, 20%, 40%);
      --fg-faint: hsl(215, 20%, 55%);
      --border: hsl(215, 28%, 88%);
      --border-soft: hsl(215, 28%, 92%);
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.10);
      --accent-warn: #d97706;
      --accent-danger: #dc2626;
      --accent-ok: #16a34a;
      --chart-grid: rgba(37, 99, 235, 0.10);
      --chart-1: #2563eb;
      --chart-2: #16a34a;
      --chart-3: #d97706;
      --chart-4: #dc2626;
      --chart-5: #7c3aed;
      --chart-6: #0891b2;
    }
    :root[data-theme="dark"] {
      --bg: #0a0f1e;
      --bg-elev: #0d1420;
      --bg-card: #0f1828;
      --fg: #e8e8e8;
      --fg-muted: #aaa;
      --fg-faint: #777;
      --border: rgba(255, 255, 255, 0.10);
      --border-soft: rgba(255, 255, 255, 0.06);
      --primary: #60a5fa;
      --primary-soft: rgba(96, 165, 250, 0.18);
      --accent-warn: #fbbf24;
      --accent-danger: #f87171;
      --accent-ok: #4ade80;
      --chart-grid: rgba(255, 255, 255, 0.06);
      --chart-1: #60a5fa;
      --chart-2: #4ade80;
      --chart-3: #fbbf24;
      --chart-4: #f87171;
      --chart-5: #a78bfa;
      --chart-6: #22d3ee;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .mono { font-family: ui-monospace, "JetBrains Mono", monospace; }
    #app { display: flex; flex-direction: column; height: 100%; padding: 16px; gap: 12px; }

    .header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding-bottom: 6px; border-bottom: 1px solid var(--border-soft);
    }
    .header h1 {
      font-size: 11px; font-weight: 600; color: var(--fg-muted);
      letter-spacing: 0.22em; text-transform: uppercase;
    }
    .header .badge {
      font-family: ui-monospace, monospace; font-size: 10px; color: var(--primary);
      background: var(--primary-soft); border: 1px solid var(--primary);
      border-radius: 4px; padding: 2px 8px; font-weight: 600;
    }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (max-width: 540px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .stat {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 4px;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .stat[data-clickable="1"] {
      cursor: pointer;
      position: relative;
    }
    .stat[data-clickable="1"]::after {
      content: "›";
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 18px; font-weight: 600;
      opacity: 0.45;
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .stat[data-clickable="1"]:hover {
      background: var(--bg-elev);
      border-color: var(--primary);
    }
    .stat[data-clickable="1"]:hover::after {
      opacity: 1;
      transform: translateY(-50%) translateX(2px);
    }
    .stat-label {
      font-size: 9px; color: var(--fg-faint); text-transform: uppercase;
      letter-spacing: 0.16em; font-weight: 600;
    }
    .stat-value {
      font-family: ui-monospace, "JetBrains Mono", monospace;
      font-size: 22px; font-weight: 700; color: var(--fg);
      line-height: 1.1; font-variant-numeric: tabular-nums;
    }
    .stat.ok .stat-value { color: var(--accent-ok); }
    .stat.warn .stat-value { color: var(--accent-warn); }

    .charts {
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 10px; flex: 1; min-height: 0;
    }
    .chart-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px; display: flex; flex-direction: column; overflow: hidden;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .chart-card[data-clickable="1"] {
      cursor: pointer;
      position: relative;
    }
    .chart-card[data-clickable="1"]::after {
      content: "›";
      position: absolute;
      right: 12px; top: 12px;
      color: var(--primary);
      font-size: 16px; font-weight: 600;
      opacity: 0.45;
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .chart-card[data-clickable="1"]:hover {
      background: var(--bg-elev);
      border-color: var(--primary);
    }
    .chart-card[data-clickable="1"]:hover::after {
      opacity: 1;
      transform: translateX(2px);
    }
    .interactive-hint {
      font-size: 10px;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px dashed var(--primary);
      border-radius: 4px;
      padding: 4px 10px;
      display: inline-flex; align-items: center; gap: 6px;
      font-family: ui-monospace, "JetBrains Mono", monospace;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .interactive-hint::before {
      content: "✦";
      font-size: 11px;
    }

    /* Reactivity affordances — show the dashboard is being driven by
       the agent in real time, not just demo data. */
    .attribution {
      font-size: 9px; color: var(--fg-faint);
      font-family: ui-monospace, "JetBrains Mono", monospace;
      letter-spacing: 0.08em; text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--bg-elev);
      border: 1px solid var(--border-soft);
      transition: background 200ms ease, border-color 200ms ease, color 200ms ease;
    }
    .attribution[data-recent="1"] {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: var(--primary);
    }
    .attribution .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--fg-faint);
    }
    .attribution[data-recent="1"] .dot {
      background: var(--primary);
      animation: pulseDot 1.6s ease-out infinite;
    }
    @keyframes pulseDot {
      0%   { box-shadow: 0 0 0 0 var(--primary-soft); }
      80%  { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .live-callout {
      grid-column: span 4;
      display: none;
      align-items: center; gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--primary);
      background: var(--primary-soft);
      font-size: 11px;
      color: var(--primary);
      font-family: ui-monospace, "JetBrains Mono", monospace;
      letter-spacing: 0.02em;
    }
    .live-callout[data-visible="1"] { display: flex; }
    .live-callout::before {
      content: "✦";
      font-size: 13px;
    }
    .live-callout .label {
      color: var(--fg-faint);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 600;
    }
    .live-callout .body {
      color: var(--fg);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @keyframes flashLive {
      0%   { background: var(--primary-soft); }
      100% { background: transparent; }
    }
    .stat[data-just-arrived="1"],
    .chart-card[data-just-arrived="1"] {
      animation: flashLive 1.4s ease-out;
    }
    .chart-card.full-width { grid-column: span 2; }
    @media (max-width: 540px) {
      .charts { grid-template-columns: 1fr; grid-template-rows: auto; }
      .chart-card.full-width { grid-column: span 1; }
    }
    .chart-title {
      font-size: 9px; font-weight: 600; color: var(--fg-faint);
      text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 8px; flex-shrink: 0;
    }
    .chart-wrap { flex: 1; position: relative; min-height: 0; }
    canvas { width: 100% !important; height: 100% !important; }
    .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--fg-faint); font-size: 11px; font-style: italic; }
  </style>
</head>
<body>
<div id="app">
  <header class="header">
    <h1>AP Analytics Dashboard</h1>
    <span class="interactive-hint">Click any tile or chart to ask the agent</span>
    <span class="attribution" id="attribution" data-recent="0">
      <span class="dot" aria-hidden="true"></span>
      <span id="attribution-text">Showing demo data · awaiting agent run</span>
    </span>
  </header>
  <div class="live-callout" id="live-callout" data-visible="0">
    <span class="label">Just added by agent</span>
    <span class="body" id="live-callout-body">—</span>
  </div>
  <section class="stats">
    <div class="stat" data-clickable="1" data-intent="invoices" role="button" tabindex="0" title="Ask the agent for a full invoice list">
      <div class="stat-label">Invoices</div>
      <div class="stat-value" id="stat-count">0</div>
    </div>
    <div class="stat" data-clickable="1" data-intent="total" role="button" tabindex="0" title="Ask the agent about total spend">
      <div class="stat-label">Total Value</div>
      <div class="stat-value" id="stat-total">$0</div>
    </div>
    <div class="stat ok" data-clickable="1" data-intent="approved" role="button" tabindex="0" title="Ask the agent for approved invoices">
      <div class="stat-label">Approved</div>
      <div class="stat-value" id="stat-approved">0</div>
    </div>
    <div class="stat warn" data-clickable="1" data-intent="exceptions" role="button" tabindex="0" title="Ask the agent for invoices needing review">
      <div class="stat-label">Exceptions</div>
      <div class="stat-value" id="stat-exceptions">0</div>
    </div>
  </section>
  <section class="charts">
    <div class="chart-card full-width" data-clickable="1" data-intent="aging" role="button" tabindex="0" title="Ask the agent about invoice aging">
      <div class="chart-title">Invoice Aging</div>
      <div class="chart-wrap"><canvas id="aging-chart"></canvas></div>
    </div>
    <div class="chart-card" data-clickable="1" data-intent="vendors" role="button" tabindex="0" title="Ask the agent about top vendors">
      <div class="chart-title">Top Vendors by Value</div>
      <div class="chart-wrap"><canvas id="vendor-chart"></canvas></div>
    </div>
    <div class="chart-card" data-clickable="1" data-intent="gl_codes" role="button" tabindex="0" title="Ask the agent about GL code distribution">
      <div class="chart-title">GL Code Distribution</div>
      <div class="chart-wrap"><canvas id="gl-chart"></canvas></div>
    </div>
  </section>
</div>

<script type="module">
  function tok(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function chartPalette() {
    return [tok("--chart-1"), tok("--chart-2"), tok("--chart-3"), tok("--chart-4"), tok("--chart-5"), tok("--chart-6")];
  }

  function clearCanvas(canvas) {
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.parentElement.clientWidth;
    const h = canvas.parentElement.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { ctx, w, h };
  }

  // Pick a "nice" integer tick scale for a chart whose values are all
  // small counts (eg. invoice-aging buckets where max is usually 2-6).
  // The naive `max * i / 4` then `Math.round` collapses 0.5 → 1 and
  // 1.5 → 2, so a max=2 chart shows y-axis "0 1 1 2 2" (duplicates).
  // Round the max UP to a multiple of `tickCount` so every label is
  // distinct, and cap at 5 ticks total so the grid stays uncluttered.
  function niceTicks(rawMax, maxTicks = 5) {
    const m = Math.max(1, Math.ceil(rawMax));
    // Try increasing step sizes (1, 2, 5, 10, 20, 50, …) until ≤ maxTicks.
    const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
    for (const step of steps) {
      const niceMax = Math.ceil(m / step) * step;
      const count = niceMax / step + 1; // includes 0
      if (count <= maxTicks) {
        const ticks = [];
        for (let v = 0; v <= niceMax; v += step) ticks.push(v);
        return { ticks, niceMax };
      }
    }
    return { ticks: [0, m], niceMax: m };
  }

  function drawBar(canvas, labels, values, colors) {
    const { ctx, w, h } = clearCanvas(canvas);
    if (!values.length) {
      ctx.fillStyle = tok("--fg-faint"); ctx.font = "11px ui-sans-serif, system-ui";
      ctx.fillText("No data", w / 2 - 20, h / 2);
      return;
    }
    const pad = { top: 12, right: 12, bottom: 28, left: 38 };
    const cw = w - pad.left - pad.right;
    const ch = h - pad.top - pad.bottom;
    const rawMax = Math.max(...values, 1);
    const { ticks, niceMax } = niceTicks(rawMax, 5);
    const bw = cw / labels.length;

    ctx.strokeStyle = tok("--chart-grid");
    ctx.lineWidth = 1;
    ticks.forEach((tickVal) => {
      const y = pad.top + ch - (ch * tickVal / niceMax);
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cw, y); ctx.stroke();
      ctx.fillStyle = tok("--fg-faint");
      ctx.font = "9px ui-monospace, monospace"; ctx.textAlign = "right";
      ctx.fillText(String(tickVal), pad.left - 4, y + 3);
    });

    labels.forEach((lbl, i) => {
      const x = pad.left + i * bw;
      const bh = (values[i] / niceMax) * ch;
      const by = pad.top + ch - bh;
      ctx.fillStyle = Array.isArray(colors) ? colors[i % colors.length] : colors;
      // Slight rounded-top rectangle effect — just round corners via clip
      ctx.fillRect(x + 4, by, bw - 8, bh);
      ctx.fillStyle = tok("--fg-muted");
      ctx.font = "9px ui-sans-serif, system-ui"; ctx.textAlign = "center";
      const short = lbl.length > 10 ? lbl.slice(0, 9) + "…" : lbl;
      ctx.fillText(short, x + bw / 2, h - 8);
    });
  }

  function drawHorizontalBar(canvas, labels, values) {
    const { ctx, w, h } = clearCanvas(canvas);
    if (!values.length) {
      ctx.fillStyle = tok("--fg-faint"); ctx.font = "11px ui-sans-serif, system-ui";
      ctx.fillText("No data", w / 2 - 20, h / 2);
      return;
    }
    const palette = chartPalette();
    const pad = { top: 4, right: 8, bottom: 4, left: 4 };
    const max = Math.max(...values, 1);
    const rowH = (h - pad.top - pad.bottom) / labels.length;
    labels.forEach((lbl, i) => {
      const y = pad.top + i * rowH;
      const labelW = Math.min(w * 0.42, 92);
      ctx.fillStyle = tok("--fg-muted");
      ctx.font = "10px ui-sans-serif, system-ui"; ctx.textAlign = "left";
      const short = lbl.length > 14 ? lbl.slice(0, 13) + "…" : lbl;
      ctx.fillText(short, 0, y + rowH * 0.65);
      const barMaxW = w - labelW - 56 - pad.right;
      const barW = (values[i] / max) * barMaxW;
      ctx.fillStyle = palette[i % palette.length];
      ctx.fillRect(labelW, y + 4, barW, rowH - 10);
      ctx.fillStyle = tok("--fg");
      ctx.font = "10px ui-monospace, monospace"; ctx.textAlign = "left";
      ctx.fillText("$" + fmtNum(values[i]), labelW + barW + 4, y + rowH * 0.65);
    });
  }

  function drawDonut(canvas, labels, values) {
    const { ctx, w, h } = clearCanvas(canvas);
    if (!values.length) {
      ctx.fillStyle = tok("--fg-faint"); ctx.font = "11px ui-sans-serif, system-ui";
      ctx.fillText("No data", w / 2 - 20, h / 2);
      return;
    }
    const palette = chartPalette();
    const total = values.reduce((a, b) => a + b, 0);
    const cx = w * 0.36, cy = h / 2;
    const r = Math.min(cx, h / 2) * 0.85;
    const inner = r * 0.62;
    let start = -Math.PI / 2;
    values.forEach((v, i) => {
      const angle = (v / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + angle);
      ctx.closePath();
      ctx.fillStyle = palette[i % palette.length];
      ctx.fill();
      start += angle;
    });
    ctx.beginPath(); ctx.arc(cx, cy, inner, 0, Math.PI * 2); ctx.fillStyle = tok("--bg-card"); ctx.fill();
    ctx.fillStyle = tok("--fg");
    ctx.font = "600 13px ui-monospace, monospace"; ctx.textAlign = "center";
    ctx.fillText(values.length + " codes", cx, cy + 4);

    const lx = w * 0.62;
    const lyStart = (h - labels.length * 16) / 2;
    labels.forEach((lbl, i) => {
      const ly = lyStart + i * 16;
      ctx.fillStyle = palette[i % palette.length];
      ctx.fillRect(lx, ly + 1, 10, 10);
      ctx.fillStyle = tok("--fg-muted");
      ctx.font = "10px ui-sans-serif, system-ui"; ctx.textAlign = "left";
      const short = lbl.length > 12 ? lbl.slice(0, 11) + "…" : lbl;
      ctx.fillText(short, lx + 14, ly + 9);
    });
  }

  function fmtNum(n) {
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
    if (n >= 1_000) return (n / 1_000).toFixed(0) + "K";
    return String(Math.round(n));
  }

  // ─── Data model ──────────────────────────────────────────────────
  // Demo seed lifted from the vendor master so the dashboard looks
  // populated the moment a judge opens the tab — no empty states.
  const DEMO = [
    { vendor: "Acme GmbH",       country: "DE", amount: 9000,   glCode: "5200-OPEX-CLOUD",  daysOld: 4,  status: "approved",     invoiceNumber: "INV-2026-019" },
    { vendor: "Acme GmbH",       country: "DE", amount: 9000,   glCode: "5200-OPEX-CLOUD",  daysOld: 35, status: "approved",     invoiceNumber: "INV-2025-187" },
    { vendor: "TechCorp Ltd",    country: "GB", amount: 6150,   glCode: "5100-SW-LICENCE",  daysOld: 18, status: "approved",     invoiceNumber: "INV-2026-018" },
    { vendor: "Apex Consulting", country: "FR", amount: 45000,  glCode: "5400-PROF-SVCS",   daysOld: 50, status: "needs_review", invoiceNumber: "INV-2026-103" },
    { vendor: "Nordic Parts AB", country: "SE", amount: 3200,   glCode: "5300-MFG-PARTS",   daysOld: 1,  status: "needs_review", invoiceNumber: "INV-2026-889" },
    { vendor: "BlockedCo S.A.",  country: "ES", amount: 4800,   glCode: "UNKNOWN",          daysOld: 72, status: "exception",    invoiceNumber: "INV-2026-501" },
  ];
  let invoices = [...DEMO];

  function updateStats() {
    document.getElementById("stat-count").textContent = invoices.length;
    const total = invoices.reduce((s, i) => s + i.amount, 0);
    document.getElementById("stat-total").textContent = "$" + fmtNum(total);
    document.getElementById("stat-approved").textContent =
      invoices.filter(i => i.status === "approved").length;
    document.getElementById("stat-exceptions").textContent =
      invoices.filter(i => i.status === "exception" || i.status === "needs_review").length;
  }

  function updateCharts() {
    updateStats();
    const palette = chartPalette();

    const buckets = ["0–7 days", "8–14", "15–30", "31–60", "60+"];
    const bucketVals = [0, 0, 0, 0, 0];
    invoices.forEach(inv => {
      const d = inv.daysOld ?? 0;
      if (d <= 7) bucketVals[0]++;
      else if (d <= 14) bucketVals[1]++;
      else if (d <= 30) bucketVals[2]++;
      else if (d <= 60) bucketVals[3]++;
      else bucketVals[4]++;
    });
    drawBar(
      document.getElementById("aging-chart"),
      buckets,
      bucketVals,
      [palette[1], palette[0], palette[2], palette[3], palette[3]],
    );

    const vendorMap = {};
    invoices.forEach(inv => { vendorMap[inv.vendor] = (vendorMap[inv.vendor] || 0) + inv.amount; });
    const vendors = Object.entries(vendorMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
    drawHorizontalBar(
      document.getElementById("vendor-chart"),
      vendors.map(v => v[0]),
      vendors.map(v => v[1]),
    );

    const glMap = {};
    invoices.forEach(inv => {
      const gl = inv.glCode || "Unknown";
      glMap[gl] = (glMap[gl] || 0) + inv.amount;
    });
    const gls = Object.entries(glMap).sort((a, b) => b[1] - a[1]).slice(0, 6);
    drawDonut(
      document.getElementById("gl-chart"),
      gls.map(g => g[0]),
      gls.map(g => g[1]),
    );
  }

  updateCharts();
  window.addEventListener("resize", updateCharts);

  // ─── MCP Apps protocol ───────────────────────────────────────────
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    updateCharts(); // re-resolve CSS tokens against the new theme
  }

  function reply(id, result) {
    window.parent.postMessage(
      { jsonrpc: "2.0", id, result, __platformTransport: true }, "*"
    );
  }
  function notify(method, params) {
    window.parent.postMessage(
      { jsonrpc: "2.0", method, params, __platformTransport: true }, "*"
    );
  }

  // ─── Click → user_intent dispatch ───────────────────────────────
  // Spec-standard ui/update-model-context channel with a `user_intent`
  // convention. Host pattern-matches and auto-sends the `intent` string
  // as a chat message; the orchestrator answers via its normal path.
  function sendUserIntent(intent, context) {
    notify("ui/update-model-context", {
      structuredContent: {
        user_intent: {
          intent,
          source: "ap_dashboard",
          context: context || {},
        },
      },
    });
  }

  const INTENT_TEMPLATES = {
    invoices: "List all invoices in the current AP queue with status and amount.",
    total: "Break down the total AP spend by status — approved vs needs-review vs exceptions.",
    approved: "List the approved invoices ready for payment, oldest first.",
    exceptions: "Show me the invoices currently flagged for review or exception — vendor, amount, reason.",
    aging: "Which invoices are oldest? Group by aging band (0–7, 8–14, 15–30, 31–60, 60+ days).",
    vendors: "List the top 5 vendors by spend this period, with their invoice counts.",
    gl_codes: "Break down AP spend by GL code — which codes are dominant?",
  };

  function handleActivation(target) {
    if (!target) return false;
    const el = target.closest("[data-clickable='1'][data-intent]");
    if (!el) return false;
    const key = el.getAttribute("data-intent") || "";
    const intent = INTENT_TEMPLATES[key];
    if (!intent) return false;
    sendUserIntent(intent, { intent_key: key });
    flashElement(el);
    return true;
  }

  document.body.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target : null;
    handleActivation(target);
  });

  // Keyboard activation — Enter / Space on role="button" elements,
  // matching native button semantics so the role="button" tabindex="0"
  // divs aren't keyboard-traps. (Restructuring as <button> would break
  // the chart-card layout because <button> can't contain block-level
  // children in valid HTML.)
  document.body.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const target = event.target instanceof Element ? event.target : null;
    if (handleActivation(target)) event.preventDefault();
  });

  function flashElement(el) {
    const prevBorder = el.style.borderColor;
    el.style.borderColor = "var(--primary)";
    el.style.background = "var(--primary-soft)";
    setTimeout(() => {
      el.style.borderColor = prevBorder;
      el.style.background = "";
    }, 200);
  }

  // ─── Reactivity surfacing — make agent-driven updates visible ──
  function markAttribution(source) {
    const labelMap = {
      validator: "Validator",
      ap_validator: "Validator",
      extractor: "Extractor",
      invoice_extractor: "Extractor",
      poster: "Poster",
      ap_poster: "Poster",
      orchestrator: "Orchestrator",
      ap_orchestrator: "Orchestrator",
    };
    const label = labelMap[source] || source;
    const el = document.getElementById("attribution");
    const txt = document.getElementById("attribution-text");
    if (!el || !txt) return;
    txt.textContent = `Updated by ${label} · just now`;
    el.dataset.recent = "1";
    clearTimeout(el.__recencyTimer);
    el.__recencyTimer = setTimeout(() => {
      el.dataset.recent = "0";
      txt.textContent = `Last updated by ${label}`;
    }, 5000);
  }

  function showLiveCallout(inv) {
    const el = document.getElementById("live-callout");
    const body = document.getElementById("live-callout-body");
    if (!el || !body) return;
    const amount = typeof inv.amount === "number"
      ? "$" + fmtNum(inv.amount)
      : "";
    const parts = [];
    if (inv.vendor) parts.push(inv.vendor);
    if (inv.invoiceNumber) parts.push(inv.invoiceNumber);
    if (amount) parts.push(amount);
    if (inv.status) parts.push(String(inv.status).toUpperCase());
    body.textContent = parts.join(" · ");
    el.dataset.visible = "1";
  }

  function flashAllCards() {
    // Brief pulse on every chart + stat card so the user sees the
    // dashboard "tick" in response to the agent's emission, not just
    // the stat numbers silently changing.
    document.querySelectorAll(".stat, .chart-card").forEach((el, i) => {
      setTimeout(() => {
        el.dataset.justArrived = "1";
        setTimeout(() => { el.dataset.justArrived = "0"; }, 1500);
      }, i * 60);
    });
  }

  let __dash_initRequestId = 1;
  const __dash_pending = new Map();
  function request(method, params) {
    const id = `dash-${__dash_initRequestId++}`;
    window.parent.postMessage(
      { jsonrpc: "2.0", id, method, params, __platformTransport: true }, "*"
    );
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        __dash_pending.delete(id);
        reject(new Error(`${method} timed out`));
      }, 5000);
      __dash_pending.set(id, (result) => {
        clearTimeout(timeout);
        resolve(result);
      });
    });
  }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || !msg.jsonrpc) return;

    if (msg.id !== undefined && msg.id !== null && __dash_pending.has(msg.id)) {
      const resolver = __dash_pending.get(msg.id);
      __dash_pending.delete(msg.id);
      resolver?.(msg.result);
      return;
    }

    if (msg.method === "ui/initialize") {
      const ctxTheme = msg.params?.hostContext?.theme;
      if (ctxTheme) applyTheme(ctxTheme);
      reply(msg.id, {
        protocolVersion: "2026-01-26",
        capabilities: {},
        serverInfo: { name: "ap-dashboard", version: "1.1" },
      });
      return;
    }

    if (msg.method === "ping") { reply(msg.id, {}); return; }

    if (msg.method === "ui/update-theme" && msg.params?.theme) {
      applyTheme(msg.params.theme);
      return;
    }

    if (msg.method === "ui/update-data" && msg.params) {
      const p = msg.params;
      if (p.reset) { invoices = []; }
      let liveAdded = null;
      if (p.invoice) {
        const inv = p.invoice;
        const existing = invoices.find(i => i.vendor === inv.vendor && i.invoiceNumber === inv.invoiceNumber);
        if (existing) {
          Object.assign(existing, inv);
        } else {
          invoices.push({ daysOld: 0, glCode: "Unknown", status: "pending", ...inv });
        }
        liveAdded = inv;
      }
      if (p.invoices && Array.isArray(p.invoices)) {
        invoices = p.invoices.map(inv => ({ daysOld: 0, glCode: "Unknown", status: "pending", ...inv }));
        liveAdded = p.invoices[p.invoices.length - 1] || null;
      }
      updateCharts();
      if (p.source) markAttribution(p.source);
      if (liveAdded) showLiveCallout(liveAdded);
      flashAllCards();
      return;
    }
  });

  (async () => {
    try {
      const initResult = await request("ui/initialize", {
        protocolVersion: "2026-01-26",
        capabilities: {},
        clientInfo: { name: "ap-dashboard", version: "1.1" },
      });
      const theme = initResult?.hostContext?.theme;
      if (theme) applyTheme(theme);
    } catch (err) {
      console.warn("[ap-dashboard] ui/initialize failed:", err);
    }
    notify("ui/notifications/initialized", {
      clientInfo: { name: "ap-dashboard", version: "1.1" },
    });
  })();
</script>
</body>
</html>
